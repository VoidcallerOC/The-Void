name: Deploy release-per-contract infrastructure to Fuji

# This workflow is intentionally separate from the legacy V1/V2 and MusicMarketplace
# workflows. The default path is non-broadcast dry-run only, and it never receives the private
# key: it plans from expected_deployer_address. DEPLOYER_PRIVATE_KEY is exposed only to the single
# signing step of an approved broadcast dispatched from main.

on:
  workflow_dispatch:
    inputs:
      broadcast_deployment:
        description: Set true only for an approved future Fuji broadcast.
        required: true
        type: boolean
        default: false
      confirm_fuji_deploy:
        description: Type I_CONFIRM_FUJI_RELEASE_PER_CONTRACT_DEPLOY only for an approved broadcast.
        required: false
        type: string
        default: ""
      expected_deployer_address:
        description: Deployer address (0x...) the owner reviewed. The dry run plans from it; a broadcast from a different key is refused.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: void-release-per-contract-fuji-deployment
  cancel-in-progress: false

env:
  DEPLOY_NETWORK: fuji
  AVALANCHE_FUJI_RPC_URL: ${{ secrets.AVALANCHE_FUJI_RPC_URL }}
  RELEASE_PLATFORM_RECIPIENT: ${{ secrets.RELEASE_PLATFORM_RECIPIENT }}
  RELEASE_PLATFORM_FEE_BPS: ${{ secrets.RELEASE_PLATFORM_FEE_BPS }}
  RELEASE_SALE_OWNER: ${{ secrets.RELEASE_SALE_OWNER }}
  RELEASE_MARKETPLACE_FEE_RECIPIENT: ${{ secrets.RELEASE_MARKETPLACE_FEE_RECIPIENT }}
  CONFIRM_FUJI_DEPLOY: ${{ inputs.confirm_fuji_deploy == 'I_CONFIRM_FUJI_RELEASE_PER_CONTRACT_DEPLOY' && 'yes' || 'no' }}
  BROADCAST_REQUESTED: ${{ inputs.broadcast_deployment && 'yes' || 'no' }}
  EXPECTED_DEPLOYER_ADDRESS: ${{ inputs.expected_deployer_address }}

jobs:
  preflight:
    name: Validate and prepare release-per-contract deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Report deployer state without the key
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { JsonRpcProvider, getAddress, getCreateAddress, isAddress } from "ethers";

          const expected = String(process.env.EXPECTED_DEPLOYER_ADDRESS || "").trim();
          if (!isAddress(expected)) throw new Error("expected_deployer_address must be a valid address.");
          const deployer = getAddress(expected);
          const provider = new JsonRpcProvider(
            process.env.AVALANCHE_FUJI_RPC_URL,
            43113,
            { staticNetwork: true },
          );
          const chainId = BigInt(await provider.send("eth_chainId", []));
          if (chainId !== 43113n) {
            throw new Error(`Unexpected chain ID: ${chainId}`);
          }
          const balance = await provider.getBalance(deployer);
          console.log(`deployer_address=${deployer}`);
          console.log(`fuji_chain_id=${chainId}`);
          console.log(`fuji_balance_wei=${balance}`);
          // Nonce and predicted CREATE addresses are for owner cross-check only, never for wiring.
          const nonce = await provider.getTransactionCount(deployer, "latest");
          const pendingNonce = await provider.getTransactionCount(deployer, "pending");
          console.log(`deployer_nonce=${nonce}`);
          console.log(`deployer_pending_nonce=${pendingNonce}`);
          console.log(`predicted_factory_address=${getCreateAddress({ from: deployer, nonce })}`);
          console.log(`predicted_marketplace_address=${getCreateAddress({ from: deployer, nonce: nonce + 1 })}`);
          // The key itself is checked against this address by the script, inside the signing step only.
          if (process.env.BROADCAST_REQUESTED === "yes" && !expected) throw new Error("A broadcast requires expected_deployer_address.");
          if (process.env.BROADCAST_REQUESTED === "yes" && pendingNonce !== nonce) throw new Error("The deployer has pending transactions; refusing to broadcast.");
          console.log("broadcasted=false");
          JS

      - name: Install pinned Foundry toolchain
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.1

      - name: Build reviewed artifacts
        run: forge build

      - name: Run deployment workflow tests
        run: npm test -- scripts/deploy-release-per-contract-fuji.test.mjs

      - name: Dry run (no key)
        if: ${{ !inputs.broadcast_deployment }}
        shell: bash
        run: |
          set -euo pipefail
          npm run deploy:release-per-contract:fuji -- --dry-run | tee deployment-output.log

      - name: Refuse a broadcast without confirmation or off main
        if: inputs.broadcast_deployment && (github.ref != 'refs/heads/main' || inputs.confirm_fuji_deploy != 'I_CONFIRM_FUJI_RELEASE_PER_CONTRACT_DEPLOY')
        run: |
          echo "A Fuji broadcast needs the exact confirmation string and a dispatch from main. Nothing was signed." >&2
          exit 1

      - name: Sign and broadcast (the only step with the key)
        if: inputs.broadcast_deployment && github.ref == 'refs/heads/main' && inputs.confirm_fuji_deploy == 'I_CONFIRM_FUJI_RELEASE_PER_CONTRACT_DEPLOY'
        shell: bash
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          BROADCAST_DEPLOYMENT: "yes"
        run: |
          set -euo pipefail
          npm run deploy:release-per-contract:fuji | tee deployment-output.log

      - name: Preserve deployment output and record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-per-contract-fuji-${{ github.run_id }}
          path: |
            deployment-output.log
            deployments/release-per-contract-fuji-*.json
          if-no-files-found: ignore
