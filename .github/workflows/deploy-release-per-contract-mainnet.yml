name: Plan release-per-contract infrastructure for C-Chain mainnet

# VoidReleaseFactoryV2Royalty + ReleaseMarketplaceV4 on Avalanche C-Chain (43114): the architecture
# validated on Fuji with the 2.5% artist royalty enforced on chain by the release clones and,
# independently, by the marketplace. Both contracts are ownerless and their fee recipient and fee
# rate are immutable once mined.
#
# Plan only. This workflow holds no private key, signs nothing and broadcasts nothing. It builds,
# tests and dry-runs, then binds the reviewed plan (including the exact unsigned creation
# transactions) to this commit and uploads plan.json and plan-binding.json. The owner signs those
# transactions in Rabby with the defined deployer, on their own machine, with
# `npm run sign:mainnet` (deploy/mainnet/OWNER-SIGNING.md). No mainnet key belongs in GitHub.

on:
  workflow_dispatch:
    inputs:
      expected_deployer_address:
        description: The defined mainnet deployer (Rabby). Any other address is refused.
        required: true
        type: string
        default: "0xaBd3746e8b852f55bE52FC44faB6cAb908b1c174"
      expected_deployer_nonce:
        description: Deployer nonce the plan is for (the predicted addresses depend on it). Required for a binding.
        required: false
        type: string
        default: ""
      platform_recipient:
        description: Primary and marketplace fee recipient. Only the Nano S Plus recorded in config/mainnet-release-per-contract.json.
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: void-release-per-contract-mainnet-plan
  cancel-in-progress: false

env:
  DEPLOY_NETWORK: mainnet
  AVALANCHE_MAINNET_RPC_URL: ${{ secrets.AVALANCHE_MAINNET_RPC_URL }}
  EXPECTED_DEPLOYER_ADDRESS: ${{ inputs.expected_deployer_address }}
  EXPECTED_DEPLOYER_NONCE: ${{ inputs.expected_deployer_nonce }}
  RELEASE_PLATFORM_RECIPIENT: ${{ inputs.platform_recipient }}
  RELEASE_PLATFORM_FEE_BPS: "250"
  RELEASE_MARKETPLACE_FEE_BPS: "250"

jobs:
  plan:
    name: Plan the C-Chain deployment (no key)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Refuse to run while a mainnet deployer key exists in GitHub
        # The mainnet deployer key never belongs in GitHub. The expression yields true/false; the
        # secret value never enters this job's environment.
        env:
          MAINNET_KEY_IN_GITHUB: ${{ secrets.MAINNET_DEPLOYER_PRIVATE_KEY != '' }}
        run: |
          if [ "${MAINNET_KEY_IN_GITHUB}" != "false" ]; then
            echo "A MAINNET_DEPLOYER_PRIVATE_KEY secret exists. The mainnet deployer signs only in Rabby; delete that secret. Refusing to run." >&2
            exit 1
          fi
          echo "No MAINNET_DEPLOYER_PRIVATE_KEY secret is reachable."

      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Install pinned Foundry toolchain
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.1

      - name: Build reviewed artifacts and prove the on-chain royalty and fee rules
        run: |
          forge build
          forge test --match-contract "RoyaltyEnforcementTest|MainnetEconomicsTest"

      - name: Run deployment and owner-signing tests
        run: npm test -- scripts/deploy-release-per-contract-mainnet.test.mjs scripts/deploy-release-per-contract-fuji.test.mjs scripts/deployment-plan-binding.test.mjs scripts/mainnet-signing-requests.test.mjs scripts/mainnet-owner-signing.test.mjs

      - name: Dry run (no key)
        shell: bash
        env:
          PLAN_OUTPUT_PATH: plan.json
        run: |
          set -euo pipefail
          npm run deploy:release-per-contract:mainnet -- --dry-run | tee plan-output.log

      - name: Bind the plan to this commit when it is ready to sign (no key)
        shell: bash
        run: |
          set -euo pipefail
          if node -e 'process.exit(JSON.parse(require("fs").readFileSync("plan.json","utf8")).readyToBroadcast === true ? 0 : 1)'; then
            node scripts/deployment-plan-binding.mjs bind --kind release-per-contract-mainnet --plan plan.json --commit "${GITHUB_SHA}" --out plan-binding.json
          else
            echo "The plan is not ready to sign (see its checks); no binding was written."
          fi

      - name: Preserve the reviewed plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-per-contract-mainnet-plan-${{ github.run_id }}
          path: |
            plan-output.log
            plan.json
            plan-binding.json
          if-no-files-found: ignore
