name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install ffprobe
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Reject public audio longer than 35 seconds
        run: |
          set -euo pipefail
          fail=0
          found=0
          while IFS= read -r -d '' f; do
            found=1
            dur=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$f" || true)
            if [ -z "$dur" ] || [ "$dur" = "N/A" ]; then
              echo "FAIL: could not read duration: $f"
              fail=1
              continue
            fi
            over=$(awk -v d="$dur" 'BEGIN { print (d+0 > 35) ? 1 : 0 }')
            if [ "$over" = "1" ]; then
              echo "FAIL: $f is ${dur}s (limit 35s)"
              fail=1
            else
              echo "ok: $f ${dur}s"
            fi
          done < <(find public -type f \( \
            -iname '*.mp3' -o -iname '*.wav' -o -iname '*.flac' -o -iname '*.m4a' \
            -o -iname '*.ogg' -o -iname '*.aac' -o -iname '*.opus' -o -iname '*.aif' \
            -o -iname '*.aiff' -o -iname '*.wma' \
          \) -print0)
          if [ "$found" = "0" ]; then
            echo "No audio files under public/"
          fi
          exit "$fail"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Cluster-wide roles. Per-database Supabase default privileges are granted
      # in server/rls-lockdown.test.js immediately before that test migrates.
      - name: Create Supabase-compatible roles
        run: psql "$TEST_DATABASE_URL" -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN;"
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres

      - name: Test
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres

      - name: Build
        run: npm run build
