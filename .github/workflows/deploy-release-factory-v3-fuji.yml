name: Deploy release Factory V3 (provenance at publication) to Fuji

# Factory V3 clones VoidRelease1155V5, which records the provenance root in the edition-creating
# transaction. Factory V2 deployments and their clones are never touched. The default path is a
# non-broadcast dry run, and no run of this workflow edits config/ or switches Studio to V3.
# The dry run never receives the private key: it plans from expected_deployer_address.
# DEPLOYER_PRIVATE_KEY is exposed only to the single signing step of an approved broadcast from main.

on:
  workflow_dispatch:
    inputs:
      broadcast_deployment:
        description: Set true only for an owner-approved Fuji broadcast.
        required: true
        type: boolean
        default: false
      confirm_fuji_deploy:
        description: Type I_CONFIRM_FUJI_RELEASE_FACTORY_V3_DEPLOY only for an approved broadcast.
        required: false
        type: string
        default: ""
      expected_deployer_address:
        description: Deployer address (0x...) the owner reviewed. The dry run plans from it; a broadcast from a different key is refused.
        required: true
        type: string
      expected_deployer_nonce:
        description: deployer_nonce printed by the reviewed dry run. Required for a broadcast; a different nonce (stale predicted addresses) is refused.
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: void-release-factory-v3-fuji-deployment
  cancel-in-progress: false

env:
  DEPLOY_NETWORK: fuji
  AVALANCHE_FUJI_RPC_URL: ${{ secrets.AVALANCHE_FUJI_RPC_URL }}
  RELEASE_PLATFORM_RECIPIENT: ${{ secrets.RELEASE_PLATFORM_RECIPIENT }}
  RELEASE_MARKETPLACE_FEE_RECIPIENT: ${{ secrets.RELEASE_MARKETPLACE_FEE_RECIPIENT }}
  CONFIRM_FUJI_DEPLOY: ${{ inputs.confirm_fuji_deploy == 'I_CONFIRM_FUJI_RELEASE_FACTORY_V3_DEPLOY' && 'yes' || 'no' }}
  BROADCAST_REQUESTED: ${{ inputs.broadcast_deployment && 'yes' || 'no' }}
  EXPECTED_DEPLOYER_ADDRESS: ${{ inputs.expected_deployer_address }}
  EXPECTED_DEPLOYER_NONCE: ${{ inputs.expected_deployer_nonce }}

jobs:
  preflight:
    name: Validate and prepare Factory V3 deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Report deployer state without the key
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { JsonRpcProvider, getAddress, getCreateAddress, isAddress } from "ethers";

          const provider = new JsonRpcProvider(process.env.AVALANCHE_FUJI_RPC_URL, 43113, { staticNetwork: true });
          const expected = String(process.env.EXPECTED_DEPLOYER_ADDRESS || "").trim();
          if (!isAddress(expected)) throw new Error("expected_deployer_address must be a valid address.");
          // The key itself is checked against this address by the script, inside the signing step only.
          const deployer = getAddress(expected);
          // staticNetwork makes getNetwork() echo 43113 without asking the node; eth_chainId asks it.
          let chainIdReply;
          try {
            chainIdReply = await provider.send("eth_chainId", []);
          } catch (error) {
            throw new Error(`eth_chainId failed on the configured RPC${error?.code ? ` (${error.code})` : ""}.`);
          }
          if (typeof chainIdReply !== "string" || !/^0x[0-9a-f]+$/i.test(chainIdReply)) throw new Error("Malformed eth_chainId reply from the configured RPC.");
          if (BigInt(chainIdReply) !== 43113n) throw new Error(`Unexpected chain ID: ${BigInt(chainIdReply)}`);
          console.log(`rpc_chain_id=${BigInt(chainIdReply)}`);
          const nonce = await provider.getTransactionCount(deployer, "latest");
          const pendingNonce = await provider.getTransactionCount(deployer, "pending");
          console.log(`deployer_address=${deployer}`);
          console.log(`fuji_balance_wei=${await provider.getBalance(deployer)}`);
          console.log(`deployer_nonce=${nonce}`);
          console.log(`deployer_pending_nonce=${pendingNonce}`);
          // Predicted CREATE addresses are for owner cross-check only, never for wiring.
          console.log(`predicted_factory_v3_address=${getCreateAddress({ from: deployer, nonce })}`);
          console.log(`predicted_marketplace_address=${getCreateAddress({ from: deployer, nonce: nonce + 1 })}`);
          if (process.env.BROADCAST_REQUESTED === "yes" && !expected) throw new Error("A broadcast requires expected_deployer_address.");
          if (process.env.BROADCAST_REQUESTED === "yes" && pendingNonce !== nonce) throw new Error("The deployer has pending transactions; refusing to broadcast.");
          const expectedNonce = String(process.env.EXPECTED_DEPLOYER_NONCE || "").trim();
          if (process.env.BROADCAST_REQUESTED === "yes" && !expectedNonce) throw new Error("A broadcast requires expected_deployer_nonce from the reviewed dry run.");
          if (expectedNonce && (!/^(0|[1-9][0-9]*)$/.test(expectedNonce) || Number(expectedNonce) !== nonce)) throw new Error(`The deployer nonce is ${nonce}, not the reviewed ${expectedNonce}: the predicted addresses are stale. Run a new dry run.`);
          console.log("broadcasted=false");
          JS

      - name: Install pinned Foundry toolchain
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.1

      - name: Build and test reviewed contracts
        run: |
          forge build
          forge test --match-contract VoidRelease1155V5Test

      - name: Run deployment script tests
        run: npm test -- scripts/deploy-release-factory-v3.test.mjs

      - name: Dry run (no key)
        if: ${{ !inputs.broadcast_deployment }}
        shell: bash
        run: |
          set -euo pipefail
          npm run deploy:release-factory-v3 -- --dry-run | tee deployment-output.log

      - name: Refuse a broadcast without confirmation or off main
        if: inputs.broadcast_deployment && (github.ref != 'refs/heads/main' || inputs.confirm_fuji_deploy != 'I_CONFIRM_FUJI_RELEASE_FACTORY_V3_DEPLOY')
        run: |
          echo "A Fuji broadcast needs the exact confirmation string and a dispatch from main. Nothing was signed." >&2
          exit 1

      - name: Sign and broadcast (the only step with the key)
        if: inputs.broadcast_deployment && github.ref == 'refs/heads/main' && inputs.confirm_fuji_deploy == 'I_CONFIRM_FUJI_RELEASE_FACTORY_V3_DEPLOY'
        shell: bash
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          BROADCAST_DEPLOYMENT: "yes"
        run: |
          set -euo pipefail
          npm run deploy:release-factory-v3 | tee deployment-output.log

      - name: Preserve deployment output and record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-factory-v3-fuji-${{ github.run_id }}
          path: |
            deployment-output.log
            deployments/release-factory-v3-fuji-*.json
          if-no-files-found: ignore
