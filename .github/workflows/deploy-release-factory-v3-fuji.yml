name: Deploy release Factory V3 (provenance at publication) to Fuji

# Factory V3 clones VoidRelease1155V5, which records the provenance root in the edition-creating
# transaction. Factory V2 deployments and their clones are never touched. The default path is a
# non-broadcast dry run, and no run of this workflow edits config/ or switches Studio to V3.

on:
  workflow_dispatch:
    inputs:
      broadcast_deployment:
        description: Set true only for an owner-approved Fuji broadcast.
        required: true
        type: boolean
        default: false
      confirm_fuji_deploy:
        description: Type I_CONFIRM_FUJI_RELEASE_FACTORY_V3_DEPLOY only for an approved broadcast.
        required: false
        type: string
        default: ""
      expected_deployer_address:
        description: Deployer address (0x...) the owner reviewed. Required for a broadcast; a different key is refused.
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: void-release-factory-v3-fuji-deployment
  cancel-in-progress: false

env:
  DEPLOY_NETWORK: fuji
  AVALANCHE_FUJI_RPC_URL: ${{ secrets.AVALANCHE_FUJI_RPC_URL }}
  DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
  RELEASE_PLATFORM_RECIPIENT: ${{ secrets.RELEASE_PLATFORM_RECIPIENT }}
  RELEASE_MARKETPLACE_FEE_RECIPIENT: ${{ secrets.RELEASE_MARKETPLACE_FEE_RECIPIENT }}
  CONFIRM_FUJI_DEPLOY: ${{ inputs.confirm_fuji_deploy == 'I_CONFIRM_FUJI_RELEASE_FACTORY_V3_DEPLOY' && 'yes' || 'no' }}
  BROADCAST_DEPLOYMENT: ${{ inputs.broadcast_deployment && 'yes' || 'no' }}
  EXPECTED_DEPLOYER_ADDRESS: ${{ inputs.expected_deployer_address }}

jobs:
  preflight:
    name: Validate and prepare Factory V3 deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Report deployer state without broadcasting
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { JsonRpcProvider, Wallet, getAddress, getCreateAddress, isAddress } from "ethers";

          const provider = new JsonRpcProvider(process.env.AVALANCHE_FUJI_RPC_URL, 43113, { staticNetwork: true });
          const wallet = new Wallet(process.env.DEPLOYER_PRIVATE_KEY);
          const network = await provider.getNetwork();
          if (network.chainId !== 43113n) throw new Error(`Unexpected chain ID: ${network.chainId}`);
          const nonce = await provider.getTransactionCount(wallet.address, "latest");
          const pendingNonce = await provider.getTransactionCount(wallet.address, "pending");
          console.log(`deployer_address=${wallet.address}`);
          console.log(`fuji_balance_wei=${await provider.getBalance(wallet.address)}`);
          console.log(`deployer_nonce=${nonce}`);
          console.log(`deployer_pending_nonce=${pendingNonce}`);
          // Predicted CREATE addresses are for owner cross-check only, never for wiring.
          console.log(`predicted_factory_v3_address=${getCreateAddress({ from: wallet.address, nonce })}`);
          console.log(`predicted_marketplace_address=${getCreateAddress({ from: wallet.address, nonce: nonce + 1 })}`);
          const expected = String(process.env.EXPECTED_DEPLOYER_ADDRESS || "").trim();
          if (expected && !(isAddress(expected) && getAddress(expected) === wallet.address)) throw new Error("DEPLOYER_PRIVATE_KEY does not belong to expected_deployer_address.");
          if (process.env.BROADCAST_DEPLOYMENT === "yes" && !expected) throw new Error("A broadcast requires expected_deployer_address.");
          if (process.env.BROADCAST_DEPLOYMENT === "yes" && pendingNonce !== nonce) throw new Error("The deployer has pending transactions; refusing to broadcast.");
          console.log("broadcasted=false");
          JS

      - name: Install pinned Foundry toolchain
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.1

      - name: Build and test reviewed contracts
        run: |
          forge build
          forge test --match-contract VoidRelease1155V5Test

      - name: Run deployment script tests
        run: npm test -- scripts/deploy-release-factory-v3.test.mjs

      - name: Run Factory V3 deployment preflight
        shell: bash
        run: |
          set -euo pipefail
          if [ "${BROADCAST_DEPLOYMENT}" = "yes" ]; then
            npm run deploy:release-factory-v3 | tee deployment-output.log
          else
            npm run deploy:release-factory-v3 -- --dry-run | tee deployment-output.log
          fi

      - name: Preserve deployment output and record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-factory-v3-fuji-${{ github.run_id }}
          path: |
            deployment-output.log
            deployments/release-factory-v3-fuji-*.json
          if-no-files-found: ignore
