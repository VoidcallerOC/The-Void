name: Plan the Genesis holder claim for C-Chain mainnet

# GenesisHolderClaim for the mainnet Forgive & Forget release token (created by the artist wallet on
# the recorded mainnet VoidReleaseFactoryV2Royalty; the Fuji -28 release is never a mainnet target).
# Production schedule only: 24-hour free Genesis claim from claim_start, then the token's own primary
# sale (already configured by the artist as the public phase) for 7 days at 0.25 AVAX; the contract,
# script and API all enforce it.
#
# Plan only. This workflow holds no private key, signs nothing and broadcasts nothing. The dry run
# verifies the release, sale, schedule and the C-Chain Genesis collection, enforces role separation,
# simulates the constructor, and prepares the ISSUER_ROLE grant for the release's verified admin (the
# artist wallet). It binds the plan, including the exact unsigned creation transaction, to this commit.
# The owner signs that transaction in Rabby with the defined deployer, on their own machine, with
# `npm run sign:mainnet` (deploy/mainnet/OWNER-SIGNING.md). No run grants ISSUER_ROLE, edits config/
# or enables the API claim; those are separate, separately approved operations.

on:
  workflow_dispatch:
    inputs:
      release_contract:
        description: Mainnet Forgive & Forget release contract (0x...), a V4 clone from the recorded mainnet factory.
        required: true
        type: string
      primary_sale:
        description: That release's VoidPrimarySale (0x...).
        required: true
        type: string
      token_id:
        description: On-chain token ID of the open edition.
        required: true
        type: string
      claim_start:
        description: Unix seconds when the Genesis claim opens. The sale must open exactly 86400 seconds later.
        required: true
        type: string
      claim_admin:
        description: Claim admin (pause, signer rotation). Never the fee recipient or the signer.
        required: true
        type: string
      claim_signer_address:
        description: Public address of the dedicated server voucher signer.
        required: true
        type: string
      expected_deployer_address:
        description: The defined mainnet deployer (Rabby). Any other address is refused.
        required: true
        type: string
        default: "0xaBd3746e8b852f55bE52FC44faB6cAb908b1c174"
      expected_deployer_nonce:
        description: Deployer nonce the plan is for. Required for a binding.
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: void-genesis-claim-mainnet-plan
  cancel-in-progress: false

env:
  DEPLOY_NETWORK: mainnet
  AVALANCHE_MAINNET_RPC_URL: ${{ secrets.AVALANCHE_MAINNET_RPC_URL || 'https://api.avax.network/ext/bc/C/rpc' }}
  GENESIS_RPC_URL: https://api.avax.network/ext/bc/C/rpc
  GENESIS_CLAIM_RELEASE_CONTRACT: ${{ inputs.release_contract }}
  GENESIS_CLAIM_PRIMARY_SALE: ${{ inputs.primary_sale }}
  GENESIS_CLAIM_TOKEN_ID: ${{ inputs.token_id }}
  GENESIS_CLAIM_ALLOCATION: "0"
  GENESIS_PUBLIC_MINT_ALLOCATION: "0"
  GENESIS_EXPECT_OPEN_EDITION: "yes"
  GENESIS_CLAIM_START: ${{ inputs.claim_start }}
  GENESIS_CLAIM_WINDOW_SECONDS: "86400"
  GENESIS_PUBLIC_WINDOW_SECONDS: "604800"
  GENESIS_PUBLIC_PRICE_WEI: "250000000000000000"
  GENESIS_CLAIM_ADMIN: ${{ inputs.claim_admin }}
  GENESIS_CLAIM_SIGNER_ADDRESS: ${{ inputs.claim_signer_address }}
  EXPECTED_DEPLOYER_ADDRESS: ${{ inputs.expected_deployer_address }}
  EXPECTED_DEPLOYER_NONCE: ${{ inputs.expected_deployer_nonce }}

jobs:
  plan:
    name: Plan the mainnet Genesis claim (no key)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Refuse to run while a mainnet deployer key exists in GitHub
        # The mainnet deployer key never belongs in GitHub. The expression yields true/false; the
        # secret value never enters this job's environment.
        env:
          MAINNET_KEY_IN_GITHUB: ${{ secrets.MAINNET_DEPLOYER_PRIVATE_KEY != '' }}
        run: |
          if [ "${MAINNET_KEY_IN_GITHUB}" != "false" ]; then
            echo "A MAINNET_DEPLOYER_PRIVATE_KEY secret exists. The mainnet deployer signs only in Rabby; delete that secret. Refusing to run." >&2
            exit 1
          fi
          echo "No MAINNET_DEPLOYER_PRIVATE_KEY secret is reachable."

      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Install pinned Foundry toolchain
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.1

      - name: Build and test the claim contract
        run: |
          forge build
          forge test --match-contract GenesisHolderClaim

      - name: Run claim service, deployment and owner-signing tests
        run: npm test -- scripts/deploy-genesis-claim.test.mjs server/genesis-claim.test.js scripts/deployment-plan-binding.test.mjs scripts/mainnet-signing-requests.test.mjs scripts/mainnet-owner-signing.test.mjs

      - name: Dry run (no key)
        shell: bash
        env:
          PLAN_OUTPUT_PATH: plan.json
        run: |
          set -euo pipefail
          npm run deploy:genesis-claim -- --dry-run | tee plan-output.log

      - name: Bind the plan to this commit (no key)
        shell: bash
        run: |
          set -euo pipefail
          [[ "${EXPECTED_DEPLOYER_NONCE}" =~ ^[0-9]+$ ]] || { echo "No expected_deployer_nonce given; no binding was written."; exit 0; }
          node scripts/deployment-plan-binding.mjs bind --kind genesis-claim-mainnet --plan plan.json --commit "${GITHUB_SHA}" --out plan-binding.json

      - name: Preserve the reviewed plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genesis-claim-mainnet-plan-${{ github.run_id }}
          path: |
            plan-output.log
            plan.json
            plan-binding.json
          if-no-files-found: ignore
