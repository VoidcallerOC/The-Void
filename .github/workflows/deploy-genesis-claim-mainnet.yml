name: Deploy Genesis holder claim to C-Chain mainnet

# GenesisHolderClaim for the mainnet Forgive & Forget release token (created on the mainnet
# VoidReleaseFactoryV2; the Fuji -28 release is never a mainnet target). Production schedule only:
# 24-hour free Genesis claim from claim_start, then the token's own primary sale (already configured
# as the public phase) for 7 days at 0.25 AVAX; the contract, script and API all enforce it.
# The default path is a read-only dry run that needs no private key: it verifies the release, sale,
# schedule and the C-Chain Genesis collection, enforces role separation (the passive fee recipient is
# never admin or signer; the signer is a dedicated key) and simulates the constructor. No run grants
# ISSUER_ROLE, edits config/ or enables the API claim; those follow-ups are printed for the owner.

on:
  workflow_dispatch:
    inputs:
      release_contract:
        description: Mainnet Forgive & Forget release contract (0x...), a V4 clone from the recorded mainnet factory.
        required: true
        type: string
      primary_sale:
        description: That release's VoidPrimarySale (0x...).
        required: true
        type: string
      token_id:
        description: On-chain token ID of the open edition.
        required: true
        type: string
      claim_start:
        description: Unix seconds when the Genesis claim opens. The sale must open exactly 86400 seconds later.
        required: true
        type: string
      claim_admin:
        description: Claim admin (pause, signer rotation). Never the fee recipient or the signer.
        required: true
        type: string
      claim_signer_address:
        description: Public address of the dedicated server voucher signer.
        required: true
        type: string
      expected_deployer_address:
        description: Deployer address the owner reviewed.
        required: true
        type: string
      expected_deployer_nonce:
        description: deployerNonce printed by the reviewed dry run. Required for a broadcast.
        required: false
        type: string
        default: ""
      broadcast_deployment:
        description: Set true only for the owner-approved mainnet broadcast.
        required: true
        type: boolean
        default: false
      confirm_mainnet_deploy:
        description: Type I_CONFIRM_CCHAIN_GENESIS_CLAIM_DEPLOY only for the approved broadcast.
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: void-genesis-claim-mainnet-deployment
  cancel-in-progress: false

env:
  DEPLOY_NETWORK: mainnet
  AVALANCHE_MAINNET_RPC_URL: ${{ secrets.AVALANCHE_MAINNET_RPC_URL || 'https://api.avax.network/ext/bc/C/rpc' }}
  GENESIS_RPC_URL: https://api.avax.network/ext/bc/C/rpc
  # The key is exposed to the job only for an approved broadcast; the dry run plans from the address.
  DEPLOYER_PRIVATE_KEY: ${{ inputs.broadcast_deployment && secrets.DEPLOYER_PRIVATE_KEY || '' }}
  GENESIS_CLAIM_RELEASE_CONTRACT: ${{ inputs.release_contract }}
  GENESIS_CLAIM_PRIMARY_SALE: ${{ inputs.primary_sale }}
  GENESIS_CLAIM_TOKEN_ID: ${{ inputs.token_id }}
  GENESIS_CLAIM_ALLOCATION: "0"
  GENESIS_PUBLIC_MINT_ALLOCATION: "0"
  GENESIS_EXPECT_OPEN_EDITION: "yes"
  GENESIS_CLAIM_START: ${{ inputs.claim_start }}
  GENESIS_CLAIM_WINDOW_SECONDS: "86400"
  GENESIS_PUBLIC_WINDOW_SECONDS: "604800"
  GENESIS_PUBLIC_PRICE_WEI: "250000000000000000"
  GENESIS_CLAIM_ADMIN: ${{ inputs.claim_admin }}
  GENESIS_CLAIM_SIGNER_ADDRESS: ${{ inputs.claim_signer_address }}
  CONFIRM_MAINNET_DEPLOY: ${{ inputs.confirm_mainnet_deploy == 'I_CONFIRM_CCHAIN_GENESIS_CLAIM_DEPLOY' && 'yes' || 'no' }}
  BROADCAST_DEPLOYMENT: ${{ inputs.broadcast_deployment && 'yes' || 'no' }}
  EXPECTED_DEPLOYER_ADDRESS: ${{ inputs.expected_deployer_address }}
  EXPECTED_DEPLOYER_NONCE: ${{ inputs.expected_deployer_nonce }}

jobs:
  deploy:
    name: Plan (and, only when approved, broadcast) the mainnet Genesis claim
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Install pinned Foundry toolchain
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.1

      - name: Build and test the claim contract
        run: |
          forge build
          forge test --match-contract GenesisHolderClaim

      - name: Run claim service and deployment script tests
        run: npm test -- scripts/deploy-genesis-claim.test.mjs server/genesis-claim.test.js

      - name: Plan or broadcast
        shell: bash
        run: |
          set -euo pipefail
          if [ "${BROADCAST_DEPLOYMENT}" = "yes" ]; then
            test "${CONFIRM_MAINNET_DEPLOY}" = "yes"
            npm run deploy:genesis-claim | tee deployment-output.log
          else
            npm run deploy:genesis-claim -- --dry-run | tee deployment-output.log
          fi

      - name: Preserve deployment output and record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genesis-claim-mainnet-${{ github.run_id }}
          path: |
            deployment-output.log
            deployments/genesis-claim-mainnet-*.json
          if-no-files-found: ignore
