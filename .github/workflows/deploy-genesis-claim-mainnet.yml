name: Deploy Genesis holder claim to C-Chain mainnet

# GenesisHolderClaim for the mainnet Forgive & Forget release token (created on the mainnet
# VoidReleaseFactoryV2; the Fuji -28 release is never a mainnet target). Production schedule only:
# 24-hour free Genesis claim from claim_start, then the token's own primary sale (already configured
# as the public phase) for 7 days at 0.25 AVAX; the contract, script and API all enforce it.
# The default path is a read-only dry run that needs no private key: it verifies the release, sale,
# schedule and the C-Chain Genesis collection, enforces role separation (the passive fee recipient is
# never admin or signer; the signer is a dedicated key) and simulates the constructor. No run grants
# ISSUER_ROLE, edits config/ or enables the API claim; those follow-ups are printed for the owner.
#
# Two jobs (see deploy/mainnet/DEPLOYMENT-AUTHORITY.md): `plan` (main only, no key, no environment)
# dry-runs and, for a requested broadcast, binds the reviewed plan to this commit; `broadcast` waits
# for the `mainnet-deployment` environment approval, re-plans without the key, refuses unless the
# fresh plan matches the approved binding, and only then exposes DEPLOYER_PRIVATE_KEY to the single
# signing step. Required reviewers on that environment are configured in GitHub settings, not here.

on:
  workflow_dispatch:
    inputs:
      release_contract:
        description: Mainnet Forgive & Forget release contract (0x...), a V4 clone from the recorded mainnet factory.
        required: true
        type: string
      primary_sale:
        description: That release's VoidPrimarySale (0x...).
        required: true
        type: string
      token_id:
        description: On-chain token ID of the open edition.
        required: true
        type: string
      claim_start:
        description: Unix seconds when the Genesis claim opens. The sale must open exactly 86400 seconds later.
        required: true
        type: string
      claim_admin:
        description: Claim admin (pause, signer rotation). Never the fee recipient or the signer.
        required: true
        type: string
      claim_signer_address:
        description: Public address of the dedicated server voucher signer.
        required: true
        type: string
      expected_deployer_address:
        description: Deployer address the owner reviewed.
        required: true
        type: string
      expected_deployer_nonce:
        description: deployerNonce printed by the reviewed dry run. Required for a broadcast.
        required: false
        type: string
        default: ""
      broadcast_deployment:
        description: Set true only for the owner-approved mainnet broadcast.
        required: true
        type: boolean
        default: false
      confirm_mainnet_deploy:
        description: Type I_CONFIRM_CCHAIN_GENESIS_CLAIM_DEPLOY only for the approved broadcast.
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: void-genesis-claim-mainnet-deployment
  cancel-in-progress: false

# Non-secret plan inputs shared by both jobs. DEPLOYER_PRIVATE_KEY is never set at workflow or job level.
env:
  DEPLOY_NETWORK: mainnet
  AVALANCHE_MAINNET_RPC_URL: ${{ secrets.AVALANCHE_MAINNET_RPC_URL || 'https://api.avax.network/ext/bc/C/rpc' }}
  GENESIS_RPC_URL: https://api.avax.network/ext/bc/C/rpc
  GENESIS_CLAIM_RELEASE_CONTRACT: ${{ inputs.release_contract }}
  GENESIS_CLAIM_PRIMARY_SALE: ${{ inputs.primary_sale }}
  GENESIS_CLAIM_TOKEN_ID: ${{ inputs.token_id }}
  GENESIS_CLAIM_ALLOCATION: "0"
  GENESIS_PUBLIC_MINT_ALLOCATION: "0"
  GENESIS_EXPECT_OPEN_EDITION: "yes"
  GENESIS_CLAIM_START: ${{ inputs.claim_start }}
  GENESIS_CLAIM_WINDOW_SECONDS: "86400"
  GENESIS_PUBLIC_WINDOW_SECONDS: "604800"
  GENESIS_PUBLIC_PRICE_WEI: "250000000000000000"
  GENESIS_CLAIM_ADMIN: ${{ inputs.claim_admin }}
  GENESIS_CLAIM_SIGNER_ADDRESS: ${{ inputs.claim_signer_address }}
  CONFIRM_MAINNET_DEPLOY: ${{ inputs.confirm_mainnet_deploy == 'I_CONFIRM_CCHAIN_GENESIS_CLAIM_DEPLOY' && 'yes' || 'no' }}
  EXPECTED_DEPLOYER_ADDRESS: ${{ inputs.expected_deployer_address }}
  EXPECTED_DEPLOYER_NONCE: ${{ inputs.expected_deployer_nonce }}

jobs:
  plan:
    name: Plan the mainnet Genesis claim (no key)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      BROADCAST_DEPLOYMENT: "no"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Install pinned Foundry toolchain
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.1

      - name: Build and test the claim contract
        run: |
          forge build
          forge test --match-contract GenesisHolderClaim

      - name: Run claim service and deployment script tests
        run: npm test -- scripts/deploy-genesis-claim.test.mjs server/genesis-claim.test.js scripts/deployment-plan-binding.test.mjs

      - name: Dry run (no key)
        shell: bash
        env:
          PLAN_OUTPUT_PATH: plan.json
        run: |
          set -euo pipefail
          npm run deploy:genesis-claim -- --dry-run | tee plan-output.log

      - name: Check broadcast inputs and bind the reviewed plan (no key)
        if: inputs.broadcast_deployment
        shell: bash
        run: |
          set -euo pipefail
          test "${CONFIRM_MAINNET_DEPLOY}" = "yes" || { echo "Broadcast requires the exact confirmation string." >&2; exit 1; }
          [[ "${EXPECTED_DEPLOYER_NONCE}" =~ ^[0-9]+$ ]] || { echo "Broadcast requires expected_deployer_nonce." >&2; exit 1; }
          node scripts/deployment-plan-binding.mjs bind --kind genesis-claim-mainnet --plan plan.json --commit "${GITHUB_SHA}" --out plan-binding.json

      - name: Preserve the reviewed plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genesis-claim-mainnet-plan-${{ github.run_id }}
          path: |
            plan-output.log
            plan.json
            plan-binding.json
          if-no-files-found: ignore

  broadcast:
    name: Broadcast the approved mainnet Genesis claim
    needs: plan
    if: github.ref == 'refs/heads/main' && inputs.broadcast_deployment && inputs.confirm_mainnet_deploy == 'I_CONFIRM_CCHAIN_GENESIS_CLAIM_DEPLOY'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Approval gate. Required reviewers and the main-only branch rule must be set on this environment in
    # GitHub (Settings > Environments); the YAML reference alone does not create them.
    environment: mainnet-deployment
    permissions:
      contents: read
    steps:
      - name: Check out the planned commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Install pinned Foundry toolchain
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.1

      - name: Build the claim artifact
        run: forge build

      - name: Fetch the approved plan
        uses: actions/download-artifact@v4
        with:
          name: genesis-claim-mainnet-plan-${{ github.run_id }}
          path: approved

      - name: Re-plan without the key and match it to the approved plan
        shell: bash
        env:
          BROADCAST_DEPLOYMENT: "no"
          PLAN_OUTPUT_PATH: fresh-plan.json
        run: |
          set -euo pipefail
          npm run deploy:genesis-claim -- --dry-run > /dev/null
          node scripts/deployment-plan-binding.mjs verify --kind genesis-claim-mainnet --approved approved/plan-binding.json --plan fresh-plan.json --commit "${GITHUB_SHA}"

      - name: Sign and broadcast (the only step with the key)
        shell: bash
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          BROADCAST_DEPLOYMENT: "yes"
        run: |
          set -euo pipefail
          npm run deploy:genesis-claim | tee deployment-output.log

      - name: Preserve deployment output and record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genesis-claim-mainnet-${{ github.run_id }}
          path: |
            deployment-output.log
            deployments/genesis-claim-mainnet-*.json
          if-no-files-found: ignore
