name: Fuji read-only release probe

# Read-only chain evidence for the release-per-contract deployment: album
# capability of the deployed implementation, ReleaseMarketplaceV3 parity, and
# the MusicMarketplace deployments made by the suspended Render cron.
# Uses the public Fuji RPC; no secrets, no signing, no broadcast.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/fuji-release-capability-probe.mjs
      - config/fuji-release-per-contract-v2.json
      - deployments/**
      - .github/workflows/fuji-readonly-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Probe Fuji (read-only)
        run: node scripts/fuji-release-capability-probe.mjs | tee fuji-release-capability-probe.json
      - uses: actions/upload-artifact@v4
        with:
          name: fuji-release-capability-probe
          path: fuji-release-capability-probe.json
