<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mainnet ISSUER_ROLE grant</title>
<style>
  body { margin: 0; background: #0f1012; color: #ececf1; font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 24px 16px 64px; }
  code { word-break: break-all; font-size: 13px; }
  table { border-collapse: collapse; width: 100%; margin: 12px 0; }
  td { border-bottom: 1px solid #2a2a33; padding: 6px 8px; vertical-align: top; }
  .ok { color: #3ccf91; } .bad { color: #ff6b6b; } .muted { color: #9a9aa6; }
  button { font: inherit; padding: 8px 14px; margin: 6px 6px 6px 0; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>Mainnet: grant ISSUER_ROLE to the Genesis claim</h1>
  <p class="muted">Avalanche C-Chain mainnet (chain 43114), real funds. One transaction from the artist wallet. This page holds no key and signs nothing itself: it asks Rabby, and you approve or reject there. It never sends automatically.</p>
  <table id="call"></table>
  <button id="connect">Connect Rabby</button>
  <div id="checks"></div>
  <label><input type="checkbox" id="review"> I have reviewed the call above and the checks pass.</label><br>
  <button id="send" disabled>Request grant in Rabby</button>
  <pre id="result"></pre>
</main>
<script src="/grant-issuer-mainnet.js"></script>
