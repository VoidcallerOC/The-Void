# The-Void Fuji staging runtime.
# PostgreSQL is supplied by a dedicated The-Void Fuji Supabase project.
# This Blueprint does not provision or reuse Render/ForgeCT PostgreSQL infrastructure.
# Sensitive and deployment-specific values are intentionally Render-managed.

services:
  - type: web
    name: the-void-api-fuji
    runtime: docker
    plan: 0.5c-512mb
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8787"
      # Paste only the dedicated The-Void Fuji Supabase connection string in Render.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_POOL_MAX
        value: "10"
      - key: DATABASE_POOL_IDLE_TIMEOUT_MS
        value: "30000"
      - key: DATABASE_POOL_CONNECTION_TIMEOUT_MS
        value: "5000"
      - key: PUBLIC_APP_URL
        sync: false
      - key: API_ALLOWED_ORIGINS
        sync: false
      - key: AUTH_DOMAIN
        sync: false
      - key: AUTH_URI
        sync: false
      # Pinata publishes canonical release metadata; it is separate from protected media storage.
      - key: METADATA_STORAGE_DRIVER
        value: pinata
      - key: PINATA_JWT
        sync: false
      # Protected media is signed server-side by the API using private Cloudflare R2.
      - key: MEDIA_STORAGE_DRIVER
        value: object
      - key: MEDIA_OBJECT_URL_HOSTS
        sync: false
      - key: MEDIA_OBJECT_PREFIXES
        sync: false
      - key: MEDIA_AUDIT_HASH_SECRET
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: MEDIA_GRANT_TTL_SECONDS
        value: "300"
      - key: MEDIA_SIGNED_URL_TTL_SECONDS
        value: "60"
      - key: MEDIA_MAX_BYTES
        value: "104857600"
      - key: INDEXER_RPC_URL
        value: https://api.avax-test.network/ext/bc/C/rpc
      - key: INDEXER_CHAIN_ID
        value: "43113"
      - key: INDEXER_CONFIRMATIONS
        value: "12"
      - key: INDEXER_POLL_INTERVAL_MS
        value: "15000"
      - key: INDEXER_CONTRACTS_JSON
        sync: false
      - key: MARKETPLACE_ADDRESS
        sync: false
      - key: MARKETPLACE_CHAIN_ID
        value: "43113"

  - type: worker
    name: the-void-indexer-fuji
    runtime: docker
    plan: 0.5c-512mb
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: npm run start:indexer
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      # Paste the same dedicated The-Void Fuji Supabase connection string in Render.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_POOL_MAX
        value: "10"
      - key: DATABASE_POOL_IDLE_TIMEOUT_MS
        value: "30000"
      - key: DATABASE_POOL_CONNECTION_TIMEOUT_MS
        value: "5000"
      - key: INDEXER_RPC_URL
        value: https://api.avax-test.network/ext/bc/C/rpc
      - key: INDEXER_CHAIN_ID
        value: "43113"
      - key: INDEXER_CONFIRMATIONS
        value: "12"
      - key: INDEXER_POLL_INTERVAL_MS
        value: "15000"
      - key: INDEXER_CONTRACTS_JSON
        sync: false
      - key: MARKETPLACE_ADDRESS
        sync: false
      - key: MARKETPLACE_CHAIN_ID
        value: "43113"
